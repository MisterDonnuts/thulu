name: octopus-test-cases
description: "How to write and maintain the test cases of a Thulu task with the task_test_case_* tools of octopus-api. One behavior per case, the criteria it covers and its preconditions as fields, short steps, a Pass if line with real values, priority and stable keys; importing a ## Test Cases section from the body; recording runs by hand with a one-sentence observed and their evidence; what a blocked case needs from a person and the Access given section; when to mark blocked or skipped; and where QA reads them in Thulu. Use it when planning a task, testing it or reporting what was covered."
type: knowledge
enforcement: on_demand
requires: []
# Bump on every change: the daemon syncs this skill at boot only when version exceeds the stored
# one.
version: 7
mcp: octopus-api
