name: Question
description: Ask about installing or using Thulu
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: This goes on a public issue, so leave out keys, customer names and anything else private.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: For an install problem, say which `thulu version`, which mode and what you saw.
    validations:
      required: true
