name: Thulu Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        type: string

permissions: {}

concurrency:
  group: preview-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # `thulu update` trusts only this file on main (release.PreviewIdentity); from another ref
      # the signature would be untrusted.
      - name: Refuse to run from anywhere but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::dispatch octopus-preview.yml from main (gh workflow run octopus-preview.yml --ref main -f branch=...); got $REF"
            exit 1
          fi

      # Only a branch of this repository: refs/pull/*, tags and other refs would put code nobody
      # pushed here under the preview signature.
      - name: Check that the branch exists here
        env:
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          case "$BRANCH" in
            refs/*|-*) echo "::error::give a branch name, not a ref (got $BRANCH)"; exit 1 ;;
          esac
          git check-ref-format "refs/heads/$BRANCH" || { echo "::error::not a valid branch name: $BRANCH"; exit 1; }
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          if ! git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote --exit-code --heads \
              "https://github.com/${REPO}.git" "refs/heads/${BRANCH}" >/dev/null; then
            echo "::error::$REPO has no branch $BRANCH"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - id: v
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          sha="$(git rev-parse HEAD)"
          sha7="${sha:0:7}"
          last="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          last="${last:-v0.0.0}"
          IFS=. read -r major minor patch <<<"${last#v}"
          version="${major}.${minor}.$((patch + 1))-dev.g${sha7}"
          slug="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.-]+/-/g; s/^-+//; s/-+$//' | cut -c1-80)"
          {
            echo "sha=${sha}"
            echo "version=${version}"
            echo "tag=preview-${slug}-${sha7}"
          } >> "$GITHUB_OUTPUT"
          echo "Preview ${version} of ${BRANCH} at ${sha}" >> "$GITHUB_STEP_SUMMARY"

  image-base:
    name: Image octopus-agent-base
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The workflow's own code (actions, Makefile) comes from main at dispatch; the branch only
      # goes into src/, where nothing but docker build and helm package read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.sha }}
          path: src
          persist-credentials: false

      - id: image
        uses: ./.github/actions/release-image
        with:
          name: octopus-agent-base
          file: src/images/docker/Dockerfile
          context: src/images/docker
          version: ${{ needs.meta.outputs.version }}
          tag: ${{ needs.meta.outputs.tag }}
    outputs:
      ref: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}

  # Same list as octopus-release.yml and RELEASE_IMAGES in the Makefile.
  images:
    name: Image ${{ matrix.name }}
    needs: [meta, image-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: octopus
            file: deploy/Dockerfile
            context: .
          - name: octopus-agent
            file: images/kube-agent/Dockerfile
            context: .
            base: true
          - name: octopus-agent-claude-code
            file: images/kube-agent/Dockerfile
            context: .
            base: true
            build-args: ENGINES=claude-code
          - name: octopus-agent-codex
            file: images/kube-agent/Dockerfile
            context: .
            base: true
            build-args: ENGINES=codex
          - name: octopus-agent-opencode
            file: images/kube-agent/Dockerfile
            context: .
            base: true
            build-args: ENGINES=opencode
          - name: octopus-sandbox
            file: images/sandbox/Dockerfile
            context: .
          - name: octopus-runtime
            file: images/runtime/Dockerfile
            context: images/runtime
          - name: octopus-mcp-octopus-api
            file: tools/octopus-api/Dockerfile
            context: tools/octopus-api
          - name: octopus-mcp-github
            file: tools/thulu-github/Dockerfile
            context: tools/thulu-github
          - name: octopus-mcp-browser
            file: tools/thulu-browser/Dockerfile
            context: tools/thulu-browser
          - name: octopus-mcp-cloud
            file: tools/thulu-cloud/Dockerfile
            context: tools/thulu-cloud
          - name: octopus-mcp-figma
            file: tools/thulu-figma/Dockerfile
            context: tools/thulu-figma
    steps:
      # The workflow's own code (actions, Makefile) comes from main at dispatch; the branch only
      # goes into src/, where nothing but docker build and helm package read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.sha }}
          path: src
          persist-credentials: false

      - uses: ./.github/actions/release-image
        with:
          name: ${{ matrix.name }}
          file: src/${{ matrix.file }}
          context: src/${{ matrix.context }}
          base: ${{ matrix.base && needs.image-base.outputs.ref || '' }}
          build-args: ${{ matrix.build-args || '' }}
          version: ${{ needs.meta.outputs.version }}
          tag: ${{ needs.meta.outputs.tag }}

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false   # a branch must not write the cache main and tags restore

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          BINARY="octopus_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p dist
          go build -tags hostcli -trimpath \
            -ldflags="-s -w -X github.com/MisterDonnuts/thulu/internal/buildinfo.Version=${VERSION}" \
            -o "dist/${BINARY}" \
            .

      # The bundle embeds the branch's deploy files, so it is built from the branch, here, in a
      # job that can write nothing.
      - name: Deploy bundle
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: go run ./cmd/deploy-bundle -o "dist/octopus_${VERSION}_deploy.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  chart:
    name: Chart
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # The workflow's own code (actions, Makefile) comes from main at dispatch; the branch only
      # goes into src/, where nothing but docker build and helm package read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.sha }}
          path: src
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Package and push
        id: push
        env:
          CHART_REGISTRY_USER: ${{ github.actor }}
          CHART_REGISTRY_PASSWORD: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="oci://ghcr.io/${owner}/charts"
          make chart-push VERSION="$VERSION" CHART_REPO="$repo" HELM_CHART=src/deploy/helm/octopus
          {
            echo "ref=${repo}/octopus:${VERSION}"
            echo "digest=$(cat dist/chart.digest)"
          } >> "$GITHUB_OUTPUT"

      - name: Sign chart (cosign keyless)
        env:
          REF: ${{ steps.push.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REF#oci://}@${DIGEST}"

  manifest:
    name: Manifest
    needs: [meta, image-base, images, chart, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # keyless signature over the manifest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Read as data only: the migrations lock and releases/<version>.json.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.sha }}
          path: src
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ref-*
          path: dist/images/
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Build and sign manifest
        env:
          CHART_REF: ${{ needs.chart.outputs.ref }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ needs.meta.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          pin() { echo "$1@$(docker buildx imagetools inspect "$1" --format '{{ .Manifest.Digest }}')"; }
          go run ./cmd/release-manifest \
            -version "$VERSION" -commit "$SHA" \
            -lock src/internal/schema/migrations.lock -meta src/releases \
            -images dist/images \
            -third-party "postgres=$(pin postgres:16-alpine)" \
            -third-party "caddy=$(pin caddy:2-alpine)" \
            -chart-ref "$CHART_REF" -chart-digest "$CHART_DIGEST" \
            -bundle "dist/octopus_${VERSION}_deploy.tar.gz" \
            -binaries dist \
            -notes-url "https://github.com/${REPO}/commit/${SHA}" \
            -o dist/octopus-release.json
          cosign sign-blob --yes --bundle dist/octopus-release.json.sigstore.json dist/octopus-release.json
          cosign verify-blob --bundle dist/octopus-release.json.sigstore.json \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/octopus-preview.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/octopus-release.json
          cd dist
          : > "octopus_${VERSION}_checksums.txt"
          for f in octopus_"${VERSION}"_*; do
            case "$f" in *_checksums.txt) continue ;; esac
            sha256sum "$f" >> "octopus_${VERSION}_checksums.txt"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-release
          path: |
            dist/octopus_*
            dist/octopus-release.json
            dist/octopus-release.json.sigstore.json

  # Runs no code from the repository: only this job can write releases.
  publish:
    name: Publish preview
    needs: [meta, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the preview's GitHub prerelease
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-release
          path: dist/

      - name: Create preview prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: preview-v${{ needs.meta.outputs.version }}
          target_commitish: ${{ needs.meta.outputs.sha }}
          name: "Preview ${{ needs.meta.outputs.version }} (${{ inputs.branch }})"
          body: |
            Preview build of `${{ inputs.branch }}` at ${{ needs.meta.outputs.sha }}. Not a release:
            no compatibility run, no rollback without a restore, signed only by the preview workflow.

            Install (needs OCTOPUS_UPDATE_CHANNELS to include preview, and cosign in PATH):

                thulu update -version ${{ needs.meta.outputs.version }}
          files: |
            dist/octopus_*
            dist/octopus-release.json
            dist/octopus-release.json.sigstore.json
          prerelease: true
          make_latest: false
