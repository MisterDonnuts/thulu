version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - go
    groups:
      # k8s.io modules only resolve at matching versions.
      k8s:
        patterns:
          - k8s.io/*
      go-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - frontend
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /tools/octopus-api
      - /tools/thulu-github
      - /tools/thulu-browser
      - /tools/thulu-cloud
      - /tools/thulu-figma
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - mcp
    groups:
      mcp-npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/release-image
      - /.github/actions/sign-image
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /deploy
      - /images/agent
      - /images/docker
      - /images/kube-agent
      - /images/runtime
      - /images/sandbox
      - /tools/thulu-browser
      - /tools/thulu-cloud
      - /tools/thulu-figma
      - /tools/thulu-github
      - /tools/octopus-api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
    # The project targets Node's LTS line; a major bump is a decision, not a chore.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
