# On k3s/RKE2 kata-deploy must template /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl;
# stock kata-deploy writes
# /etc/containerd/config.toml, which k3s ignores ("no runtime for kata-clh is configured").
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh
handler: kata-clh
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
overhead:
  podFixed:
    memory: "160Mi"
    cpu: "250m"
