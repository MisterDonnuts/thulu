apiVersion: v1
kind: Service
metadata:
  name: {{ include "octopus.fullname" . }}
  labels:
    {{- include "octopus.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "octopus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if .Values.tls.enabled }}
      # ingress-nginx ignores appProtocol; it needs the backend-protocol annotation (see tls in
      # values.yaml).
      appProtocol: https
      {{- end }}
    {{- if eq .Values.agentRuntime.mode "kubernetes" }}
    - name: llm-gw
      port: {{ .Values.agentRuntime.gatewayPort }}
      targetPort: llm-gw
      protocol: TCP
    {{- end }}
