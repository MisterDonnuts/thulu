{{- if .Values.ingress.enabled -}}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) -}}
{{- with .Values.ingress.certManager -}}
{{- if and .clusterIssuer .issuer -}}
{{- fail "ingress.certManager: set clusterIssuer OR issuer, not both" -}}
{{- end -}}
{{- if .clusterIssuer -}}
{{- $_ := set $annotations "cert-manager.io/cluster-issuer" .clusterIssuer -}}
{{- end -}}
{{- if .issuer -}}
{{- $_ := set $annotations "cert-manager.io/issuer" .issuer -}}
{{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "octopus.fullname" . }}
  labels:
    {{- include "octopus.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "octopus.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end -}}
