{{- if not .Values.secrets.existingSecret -}}
{{- if not .Values.secrets.jwtSecret -}}
{{- fail "secrets.jwtSecret is required (generate: openssl rand -hex 32) unless secrets.existingSecret is set. Auth fails closed without it." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octopus.fullname" . }}
  labels:
    {{- include "octopus.labels" . | nindent 4 }}
type: Opaque
stringData:
  OCTOPUS_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- with .Values.secrets.secretboxKey }}
  OCTOPUS_SECRETBOX_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.licenseKey }}
  OCTOPUS_LICENSE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.metricsToken }}
  OCTOPUS_METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidc.issuer }}
  OCTOPUS_OIDC_ISSUER: {{ . | quote }}
  OCTOPUS_OIDC_CLIENT_ID: {{ $.Values.secrets.oidc.clientId | quote }}
  OCTOPUS_OIDC_CLIENT_SECRET: {{ $.Values.secrets.oidc.clientSecret | quote }}
  {{- with $.Values.secrets.oidc.name }}
  OCTOPUS_OIDC_NAME: {{ . | quote }}
  {{- end }}
  {{- with $.Values.secrets.oidc.groupRoleMap }}
  OCTOPUS_OIDC_GROUP_ROLE_MAP: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.secrets.github.clientId }}
  OCTOPUS_GITHUB_CLIENT_ID: {{ . | quote }}
  OCTOPUS_GITHUB_CLIENT_SECRET: {{ $.Values.secrets.github.clientSecret | quote }}
  {{- end }}
{{- end -}}
