{{- if not .Values.database.existingSecret -}}
{{- if .Values.database.url -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octopus.databaseSecretName" . }}
  labels:
    {{- include "octopus.labels" . | nindent 4 }}
type: Opaque
stringData:
  OCTOPUS_DATABASE_URL: {{ .Values.database.url | quote }}
{{- else if not .Values.secrets.existingSecret -}}
{{- fail "database.url or database.existingSecret is required: the daemon keeps its state in Postgres and refuses to start without OCTOPUS_DATABASE_URL (postgres://user:pass@host:5432/octopus?sslmode=verify-full)." -}}
{{- end -}}
{{- end -}}
