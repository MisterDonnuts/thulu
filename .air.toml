root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/octopus ."
  bin = "./tmp/octopus"
  # --agents-dir is the PARENT of agents/ (types.Discover joins <agents-dir>/agents).
  args_bin = ["serve", "--addr", ":8585", "--agents-dir", "/workspace", "--data", "/data"]
  # Bind mounts under a VM don't propagate inotify events reliably, so poll.
  poll = true
  poll_interval = 500
  include_ext = ["go"]
  exclude_dir = ["tmp", "web", "agents", ".git", "docs", "deploy", "coverage"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = false
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  clean_on_exit = true
